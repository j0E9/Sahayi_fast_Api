<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Join Sahayi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>

<style>
:root{
  --bg1:#0b1a3a;
  --bg2:#020617;
  --card:#ffffff;
  --primary:#0f172a;
  --accent:#38bdf8;
  --muted:#64748b;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,var(--bg1),var(--bg2));
  font-family:Inter,Segoe UI,system-ui;
  padding:16px;
  position:relative;
}

/* ---------- TOP-RIGHT MAINTAIN  ---------- */
#maintainAnim{
  position: fixed;

  /* Safe area for notch / status bar */
  top: env(safe-area-inset-top, 12px);
  right: env(safe-area-inset-right, 12px);

  width: 88px;
  height: 88px;

  opacity: 0.85;
  pointer-events: none; /* never block taps */
  z-index: 10;
}

/* Main content wrapper */
.wrapper{
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
}


/* ---------- BRAND ---------- */
.brand{
  text-align:center;
  margin-bottom:18px;
}

.brand h1{
  color:#fff;
  font-weight:600;
  margin-bottom:4px;
}

.brand p{
  color:#94a3b8;
  font-size:14px;
  margin:0;
}

/* ---------- HOME REPAIR (STABLE) ---------- */
.worker-track{
  position:relative;
  width:100%;
  height:140px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px 0 4px;
}

#homeRepairAnim{
  width:240px;
  height:140px;
}


/* ---------- CARD ---------- */
.card-wrap{
  background:var(--card);
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

h2{
  font-size:1.1rem;
  margin-bottom:6px;
  color:#0f172a;
}

.lead{
  font-size:0.95rem;
  color:var(--muted);
  margin-bottom:16px;
}

.step{ display:none; }
.step.active{ display:block; }

.form-control{
  padding:12px;
  border-radius:10px;
  font-size:14px;
}

.form-control:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

.btn-primary{
  background:var(--primary);
  border:none;
  border-radius:10px;
  padding:12px;
  font-weight:500;
}

.otp-boxes{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:14px 0 6px;
}

.otp-boxes input{
  width:44px;
  height:52px;
  text-align:center;
  font-size:20px;
  border-radius:8px;
  border:1px solid #e5e7eb;
}

.text-danger{
  font-size:0.92rem;
}

.muted{
  color:var(--muted);
  font-size:0.9rem;
}

.small-link{
  text-align:center;
  margin-top:10px;
}

.small-link button{
  color:var(--accent);
  background:none;
  border:none;
  padding:0;
}

.footer{
  text-align:center;
  font-size:0.85rem;
  color:#94a3b8;
  margin-top:12px;
}
</style>
</head>

<body>

<!-- 🔧 TOP LEFT MAINTAIN -->
<div id="maintainAnim"></div>

<div class="wrapper">

  <!-- BRAND -->
  <div class="brand">
    <h1>Sahayi</h1>

    <!-- 🏠 HOME REPAIR WALKING -->
    <div class="worker-track">
      <div id="homeRepairAnim"></div>
    </div>

    <p>Trusted local services</p>
  </div>

  <!-- CARD -->
  <div class="card-wrap">

    <h2>Create your account</h2>
    <p class="lead">Phone-first signup. We’ll verify you with an OTP.</p>

    <!-- Step 1 -->
    <div id="step-phone" class="step active">
      <label class="form-label">Phone number</label>
      <div class="input-group mb-2">
        <span class="input-group-text">+91</span>
        <input id="phoneInput" class="form-control" maxlength="10" placeholder="10-digit mobile">
      </div>
      <div id="phoneError" class="text-danger" style="min-height:22px"></div>
      <button id="sendOtpBtn" class="btn btn-primary w-100">Send OTP</button>
    </div>

    <!-- Step 2 -->
    <div id="step-otp" class="step">
      <p class="muted">Enter OTP sent to <strong id="displayPhone"></strong></p>
      <div class="otp-boxes">
        <input maxlength="1" class="otp-input">
        <input maxlength="1" class="otp-input">
        <input maxlength="1" class="otp-input">
        <input maxlength="1" class="otp-input">
        <input maxlength="1" class="otp-input">
        <input maxlength="1" class="otp-input">
      </div>
      <div id="otpError" class="text-danger" style="min-height:22px"></div>
      <div class="d-flex gap-2">
        <button id="resendBtn" class="btn btn-outline-secondary flex-fill">Resend</button>
        <button id="verifyOtpBtn" class="btn btn-primary flex-fill">Verify</button>
      </div>
      <div class="small-link">
        <button id="editPhone">Change phone</button>
      </div>
    </div>

    <!-- Step 3 -->
    <div id="step-credentials" class="step">
      <label class="form-label">Your details</label>
      <input id="nameInput" class="form-control mb-2" placeholder="Full name">
      <input id="passwordInput" type="password" class="form-control mb-2" placeholder="Password (min 6 chars)">
      <div id="credError" class="text-danger" style="min-height:22px"></div>
      <button id="createAccountBtn" class="btn btn-primary w-100">Create account</button>
    </div>

  </div>

  <div class="footer">
    By continuing you agree to our Terms & Privacy
  </div>

</div>

<script>
/* Maintain animation (top-left) */
lottie.loadAnimation({
  container: document.getElementById('maintainAnim'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: '/static/lottie/maintain.json'
}).setSpeed(0.8);

/* Home repair walking animation */
lottie.loadAnimation({
  container: document.getElementById('homeRepairAnim'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: '/static/lottie/Maintenance_icon.json'
}).setSpeed(0.9);
</script>




<script>
/* ----------------------
   Helpers & UI refs
   ---------------------- */
function showStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function buildPhone(val){ return '+91' + val.replace(/\D/g,'').slice(-10); }

const phoneInput = document.getElementById('phoneInput');
const sendOtpBtn = document.getElementById('sendOtpBtn');
const phoneError = document.getElementById('phoneError');
const displayPhone = document.getElementById('displayPhone');

const otpInputs = Array.from(document.querySelectorAll('.otp-input'));
const verifyOtpBtn = document.getElementById('verifyOtpBtn');
const otpError = document.getElementById('otpError');
const resendBtn = document.getElementById('resendBtn');
const editPhone = document.getElementById('editPhone');

const nameInput = document.getElementById('nameInput');
const passwordInput = document.getElementById('passwordInput');
const createAccountBtn = document.getElementById('createAccountBtn');
const credError = document.getElementById('credError');

let currentPhone = null;
let resendCooldown = 0;
let resendTimer = null;

/* ----------------------
   Step 1: Send OTP
   ---------------------- */
sendOtpBtn.addEventListener('click', async () => {
  phoneError.textContent = '';
  const raw = phoneInput.value.trim();
  if (!/^\d{10}$/.test(raw)) { phoneError.textContent = 'Enter a valid 10-digit Indian mobile number.'; return; }
  const phone = buildPhone(raw);
  sendOtpBtn.disabled = true;
  sendOtpBtn.innerHTML = 'Sending <span class="spinner-border spinner-border-sm" role="status"></span>';
  try {
    const res = await fetch('/send_phone_otp', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials: 'same-origin',            // <- send cookies
      body: JSON.stringify({phone})
    });
    const data = await res.json();
    if (data.success) {
      currentPhone = phone;
      displayPhone.textContent = phone;
      // clear previous otp boxes
      otpInputs.forEach(i=>i.value='');
      showStep('step-otp');
      otpInputs[0].focus();
      startResendCooldown(60);
      console.log('[send_phone_otp] success:', data.message);
    } else {
      phoneError.textContent = data.message || 'Failed to send OTP';
    }
  } catch (err) {
    console.error(err);
    phoneError.textContent = 'Network error. Try again.';
  } finally {
    sendOtpBtn.disabled = false;
    sendOtpBtn.innerHTML = 'Next — Send OTP';
  }
});

/* ----------------------
   OTP input behavior
   ---------------------- */
otpInputs.forEach((input, idx) => {
  input.addEventListener('input', (e) => {
    const v = e.target.value.replace(/\D/g,'').slice(0,1);
    e.target.value = v;
    if (v && idx < otpInputs.length-1) otpInputs[idx+1].focus();
    if (otpInputs.every(i=>i.value.trim().length===1)) verifyOtp();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !e.target.value && idx>0) otpInputs[idx-1].focus();
  });
  input.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
    if (!text) return;
    e.preventDefault();
    for (let i=0;i<6;i++){ otpInputs[i].value = text[i]||''; }
    if (text.length>=6) verifyOtp();
  });
});

/* ----------------------
   Step 2: Verify OTP
   ---------------------- */
async function verifyOtp(){
  otpError.textContent='';
  if (!currentPhone) { otpError.textContent = 'Phone missing. Go back and enter phone again.'; return; }
  const code = otpInputs.map(i=>i.value).join('');
  if (code.length !== 6) { otpError.textContent = 'Enter the 6-digit OTP'; return; }
  verifyOtpBtn.disabled = true;
  verifyOtpBtn.innerHTML = 'Verifying <span class="spinner-border spinner-border-sm" role="status"></span>';
  try {
    const res = await fetch('/verify_phone_otp', {
      method:'POST',
      headers:{'Content-Type': 'application/json'},
      credentials: 'same-origin',            // <- send cookies
      body: JSON.stringify({phone: currentPhone, otp: code})
    });
    const data = await res.json();
    if (data.success) {
      showStep('step-credentials');
      nameInput.focus();
      console.log('[verify_phone_otp] success:', data.message);
    } else {
      otpError.textContent = data.message || 'Invalid OTP';
    }
  } catch (err) {
    console.error(err);
    otpError.textContent = 'Network error. Try again.';
  } finally {
    verifyOtpBtn.disabled = false;
    verifyOtpBtn.innerHTML = 'Verify';
  }
}
verifyOtpBtn.addEventListener('click', verifyOtp);

/* ----------------------
   Resend OTP
   ---------------------- */
resendBtn.addEventListener('click', async () => {
  if (resendCooldown>0 || !currentPhone) return;
  resendBtn.disabled = true;
  resendBtn.innerText = 'Resending...';
  try {
    const res = await fetch('/send_phone_otp', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials: 'same-origin',            // <- send cookies
      body: JSON.stringify({phone: currentPhone})
    });
    const data = await res.json();
    if (data.success) {
      startResendCooldown(60);
    } else {
      otpError.textContent = data.message || 'Failed to resend OTP';
      resendBtn.disabled = false;
      resendBtn.innerText = 'Resend';
    }
  } catch (err) {
    console.error(err);
    otpError.textContent = 'Network error. Try again.';
    resendBtn.disabled = false;
    resendBtn.innerText = 'Resend';
  }
});

function startResendCooldown(seconds){
  resendCooldown = seconds;
  resendBtn.disabled = true;
  resendBtn.innerText = `Resend (${resendCooldown}s)`;
  clearInterval(resendTimer);
  resendTimer = setInterval(()=> {
    resendCooldown--;
    if (resendCooldown <= 0) {
      clearInterval(resendTimer);
      resendBtn.disabled = false;
      resendBtn.innerText = 'Resend';
    } else {
      resendBtn.innerText = `Resend (${resendCooldown}s)`;
    }
  },1000);
}

/* allow editing phone and going back */
editPhone.addEventListener('click', () => { showStep('step-phone'); });

/* ----------------------
   Step 3: Create account
   ---------------------- */
createAccountBtn.addEventListener('click', async () => {
  credError.textContent = '';
  const name = nameInput.value.trim();
  const pw = passwordInput.value;
  if (!name) { credError.textContent = 'Enter your name'; return; }
  if (!pw || pw.length < 6) { credError.textContent = 'Password must be at least 6 characters'; return; }
  createAccountBtn.disabled = true;
  createAccountBtn.innerHTML = 'Creating <span class="spinner-border spinner-border-sm" role="status"></span>';
  try {
    const payload = new URLSearchParams();
    payload.append('phone', currentPhone);
    payload.append('name', name);
    payload.append('password', pw);

    const res = await fetch('/sign_up', {
      method: 'POST',
      credentials: 'same-origin',            // <- send cookies
      body: payload
    });

    // debug-friendly: log status & raw response if not JSON
    console.log('sign_up status:', res.status, res.statusText);
    const raw = await res.text();
    console.log('sign_up raw response:', raw);

    let data = null;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      credError.textContent = 'Server returned unexpected response. See console (raw response).';
      return;
    }

    if (data.success) {
      // redirect to welcome (server should have logged-in user)
      window.location.href = '/welcome';
    } else {
      credError.textContent = data.message || 'Signup failed';
    }
  } catch (err) {
    console.error('Network/fetch error during sign_up:', err);
    credError.textContent = 'Network error. Try again.';
  } finally {
    createAccountBtn.disabled = false;
    createAccountBtn.innerHTML = 'Create account';
  }
});

/* accessibility: Enter to verify OTP boxes */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const active = document.querySelector('.step.active');
    if (active && active.id === 'step-otp') {
      e.preventDefault();
      verifyOtp();
    }
    if (active && active.id === 'step-credentials') {
      // pressing Enter triggers create account
      e.preventDefault();
      createAccountBtn.click();
    }
  }
});
</script>
</body>
</html>
