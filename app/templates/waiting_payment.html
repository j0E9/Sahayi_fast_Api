<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⏳ Waiting for Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      font-family: 'Segoe UI', sans-serif;
    }

    .waiting-card {
      max-width: 600px;
      margin: 80px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
      padding: 30px;
    }

    .waiting-card h2 {
      color: #007bff;
      font-weight: bold;
    }

    .timer {
      font-size: 28px;
      font-weight: bold;
      color: #28a745;
      margin: 20px 0;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #28a745; }
      to { text-shadow: 0 0 15px #28a745; }
    }

    .message {
      font-size: 16px;
      color: #555;
    }

    /* Modal customization */
    .modal-content {
      border-radius: 12px;
    }

    .modal-header {
      background: linear-gradient(to right, #28a745, #50d890);
    }

    .modal-header h5 {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="waiting-card text-center">
    <h2>⏳ Waiting for Token Payment</h2>
    <p class="message">Hang tight while the job giver completes the token payment.</p>
    <p class="message">You will be notified once payment is done. You can begin your work then.</p>
    <div class="timer" id="timer">--:--</div>
  </div>

  <!-- Payment Received Modal -->
  <div class="modal fade" id="tokenReceivedModal" tabindex="-1" aria-labelledby="tokenReceivedModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-success shadow">
        <div class="modal-header text-white">
          <h5 class="modal-title" id="tokenReceivedModalLabel">🎉 Payment Received!</h5>
        </div>
        <div class="modal-body text-center">
          <p class="fs-5">✅ The job giver has successfully paid the token.</p>
          <p>You may now begin your work. 💼</p>
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-success px-4" onclick="window.location.replace('/')">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const token = "{{ booking.token }}";
    let remainingTime = {{ remaining }}; // in seconds
    const timerDisplay = document.getElementById('timer');

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      return `${minutes}:${secs}`;
    }

    timerDisplay.textContent = formatTime(remainingTime);

    const timerInterval = setInterval(() => {
      if (remainingTime > 0) {
        remainingTime--;
        timerDisplay.textContent = formatTime(remainingTime);
      } else {
        clearInterval(timerInterval);
        timerDisplay.textContent = "⛔ Time expired";
        timerDisplay.style.color = "red";
      }
    }, 1000);

    // Poll every 5 seconds to check payment status
    const checkInterval = setInterval(() => {
      fetch(`/check_token_status/${token}`)
        .then(res => res.json())
        .then(data => {
          if (data.paid) {
            clearInterval(checkInterval);
            clearInterval(timerInterval);

            const modal = new bootstrap.Modal(document.getElementById('tokenReceivedModal'));
            modal.show();
          }
        })
        .catch(err => console.error("Error checking token status:", err));
    }, 5000);
  </script>
</body>
</html>
