<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background:
              radial-gradient(circle at 0% 0%, rgba(13,110,253,0.18) 0, transparent 45%),
              radial-gradient(circle at 90% 100%, rgba(25,135,84,0.14) 0, transparent 50%),
              #f5f7fb;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .form-container {
            background: #fff;
            padding: 28px 30px 26px;
            max-width: 680px;
            margin: 40px auto;
            border-radius: 18px;
            box-shadow:
              0 18px 40px rgba(15, 23, 42, 0.08),
              0 0 0 1px rgba(148, 163, 184, 0.12);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h3 {
            color: #0d6efd;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .header-icon-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 25% 20%, #fff 0, #e0efff 50%, #cfe0ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #6c757d;
        }

        .skill-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: #e7f1ff;
            color: #0d6efd;
            font-size: 13px;
            font-weight: 600;
        }

        .skill-chip small {
            font-weight: 500;
            color: #495057;
        }

        .form-label {
            font-weight: 600;
            color: #212529;
        }

        .form-control,
        .form-control-plaintext {
            border-radius: 12px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.25);
        }

        /* Modern duration / quantity card */
        .metric-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 14px 16px 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.03);
        }

        .metric-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0d6efd;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .metric-chip span {
            font-size: 14px;
        }

        .metric-sub {
            font-size: 12px;
            color: #6b7280;
        }

        .time-input-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .modern-input {
            position: relative;
            flex: 1;
        }

        .modern-input label {
            position: absolute;
            left: 12px;
            top: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #9ca3af;
        }

        .modern-input input {
            padding-top: 22px;
            padding-bottom: 10px;
            padding-left: 12px;
            padding-right: 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 15px;
        }

        .modern-input input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.1rem rgba(13, 110, 253, 0.25);
        }

        .modern-input small {
            font-size: 11px;
            color: #9ca3af;
        }

        .btn-success {
            font-size: 17px;
            padding: 11px 14px;
            border-radius: 12px;
            transition: all 0.18s;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(25, 135, 84, 0.25);
        }

        .btn-success:hover {
            background-color: #198754;
            box-shadow: 0 12px 24px rgba(25, 135, 84, 0.35);
            transform: translateY(-1px);
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 22px 18px;
                margin-top: 16px;
            }

            .time-input-group {
                flex-direction: column;
            }
        }

        /* Animation for popup */
        #popupCard {
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.4s ease-in-out;
        }

        #popupCard.show {
            display: block !important;
            opacity: 1;
            transform: translateY(0);
        }

        /* Modern duration controls */
        .time-input-group {
          display: flex;
          gap: 12px;
          margin-top: 12px;
        }

        .duration-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 4px 11px;
          border-radius: 999px;
          background: linear-gradient(135deg, #e0f2fe, #eff6ff);
          color: #0d6efd;
          font-size: 11px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.12em;
        }

        .duration-pill span {
          font-size: 14px;
        }

        .modern-input {
          position: relative;
          flex: 1;
        }

        .modern-input label {
          position: absolute;
          left: 14px;
          top: 6px;
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          color: #9ca3af;
        }

        /* plus/minus group */
        .step-group {
          display: flex;
          align-items: center;
          background: #ffffff;
          border-radius: 12px;
          border: 1px solid #d1d5db;
          padding: 0 4px;
          transition: box-shadow 0.15s ease, border-color 0.15s ease;
          margin-top: 18px; /* space below label */
        }

        .step-group:focus-within {
          border-color: #0d6efd;
          box-shadow: 0 0 0 0.1rem rgba(13,110,253,0.25);
        }

        .step-btn {
          border: none;
          background: transparent;
          width: 32px;
          height: 32px;
          border-radius: 999px;
          font-size: 18px;
          line-height: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
        }

        .step-btn:hover {
          background: #eff6ff;
        }

        .step-input {
          border: none !important;
          box-shadow: none !important;
          text-align: center;
          width: 100%;
          font-size: 16px;
          padding: 6px 4px;
        }

        .step-input:focus {
          outline: none;
        }

        .duration-total {
          margin-top: 8px;
          font-size: 13px;
          font-weight: 600;
          color: #111827;
        }

        .duration-total span {
          color: #0d6efd;
        }

    </style>
</head>
<body>

<div class="form-container">
    <!-- Header -->
    <div class="d-flex align-items-center mb-3">
        <div class="header-icon-circle me-3">📘</div>
        <div>
            <h3 class="mb-0">Book {{ worker.name }}</h3>
            <small class="text-muted">Review the details and send your booking request</small>
        </div>
    </div>

    <hr class="mb-3">

    <form id="bookingForm" method="POST">
        <!-- Selected Skill Display -->
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-1">
                <span class="section-label">Selected skill</span>
                <span class="text-muted small">Step 1 of 2</span>
            </div>

            <div class="skill-chip mt-1">
                💼 <strong>{{ selected_skill.name.title() }}</strong>
                <small>₹{{ selected_skill.rate }} / {{ selected_skill.rate_type }}</small>
            </div>

            <!-- Hidden fields -->
            <input type="hidden" name="skill_id" value="{{ selected_skill.id }}">
            <input type="hidden" name="rate_type" id="rate_type" value="{{ selected_skill.rate_type }}">
            <input type="hidden" name="skill_name" id="skill_name" value="{{ selected_skill.name }}">
        </div>

        <!-- Job Description -->
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label mb-0">Job Description</label>
                <small class="text-muted">Step 2 of 2</small>
            </div>
            <textarea class="form-control" name="description" rows="4"
                      placeholder="Brief description of the job, location, time, and any special notes"
                      required></textarea>
        </div>

        <!-- Quantity / Duration Field (Dynamic) -->
        <div id="dynamicInput" class="mb-4"></div>

        <!-- Submit -->
        <button type="submit" class="btn btn-success w-100">✅ Confirm &amp; Book</button>
    </form>
</div>


<!-- ✅ Custom Popup Card (Bottom Left) -->
<div id="popupCard" class="card shadow-lg position-fixed bottom-0 start-0 m-3 border-0"
     style="min-width: 300px; display: none; z-index: 9999;">
  <div id="popupBody" class="card-body bg-danger text-white d-flex justify-content-between align-items-center rounded">
    <span id="popupMessage">⚠️ Warning message goes here</span>
    <button type="button" class="btn-close btn-close-white ms-3" onclick="hidePopup()"></button>
  </div>
</div>

<script>
  function hidePopup() {
    const popup = document.getElementById("popupCard");
    if (!popup) return;
    popup.classList.remove("show");
    setTimeout(() => { popup.style.display = "none"; }, 300);
  }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Worker negotiation popup (global) -->
<div id="neg-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:5000; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:12px; width:92%; max-width:420px; padding:18px;">
    <h5 id="neg-title" class="mb-2">Custom price confirmation</h5>
    <div class="text-muted small mb-2" id="neg-subtitle"></div>
    <label class="form-label mb-1">Your price (INR)</label>
    <input type="number" id="neg-worker-price" class="form-control" min="0" step="1" placeholder="Type amount">
    <div id="neg-msg" class="small text-muted mt-2"></div>
    <div class="d-flex gap-2 mt-3">
      <button id="neg-confirm" class="btn btn-primary flex-grow-1">Confirm</button>
      <button id="neg-cancel"  class="btn btn-outline-danger">Cancel</button>
    </div>
  </div>
</div>

<script>
  window.__CUSTOM_JOB__   = {{ 'true' if is_custom else 'false' }};
  window.__AGREED_PRICE__ = {{ agreed_price if agreed_price is not none else 'null' }};
</script>


<!-- JS Logic -->
<script>
function showPopup(message, type = "error") {
    const popup = document.getElementById("popupCard");
    const popupBody = document.getElementById("popupBody");
    const popupMsg = document.getElementById("popupMessage");

    // Reset classes
    popupBody.className = "card-body text-white d-flex justify-content-between align-items-center rounded";

    // Set color based on type
    if (type === "error") {
        popupBody.classList.add("bg-danger");
    } else if (type === "warning") {
        popupBody.classList.add("bg-warning", "text-dark");
    } else if (type === "success") {
        popupBody.classList.add("bg-success");
    } else {
        popupBody.classList.add("bg-secondary");
    }

    popupMsg.textContent = message;

    popup.style.display = "block";
    setTimeout(() => popup.classList.add("show"), 10);

    setTimeout(() => hidePopup(), 3000);
}

document.addEventListener("DOMContentLoaded", function () {
  const form         = document.getElementById("bookingForm");
  const rateType     = (document.getElementById("rate_type").value || "").toLowerCase();
  const dynamicInput = document.getElementById("dynamicInput");

  const isCustom    = String(window.__CUSTOM_JOB__) === "true";
  const agreedPrice = window.__AGREED_PRICE__;

  // ----- Build the dynamic section -----
  const treatAsCustom =
    isCustom || rateType === "per custom" || rateType === "custom";

  if (treatAsCustom) {
    // Custom job -> show fixed price only (no quantity inputs)
    if (agreedPrice == null) {
      dynamicInput.innerHTML = `
        <div class="alert alert-danger mb-0">
          Agreed price is missing. Please go back and complete the negotiation.
        </div>`;
      document.querySelector('#bookingForm button[type="submit"]').disabled = true;
    } else {
      dynamicInput.innerHTML = `
        <div class="metric-section">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <div class="metric-chip"><span>💰</span> Agreed price</div>
          </div>
          <input type="text" class="form-control mt-2" value="₹${agreedPrice}" disabled>
          <input type="hidden" name="agreed_price" value="${agreedPrice}">
        </div>
      `;
    }
    } else {
        // Regular job -> show inputs based on rate_type
        let html = "";

        if (rateType === "per hour") {
          // 🔁 modern, interactive duration section
          html = `
            <div class="metric-section">
              <div class="d-flex justify-content-between align-items-center">
                <div class="duration-pill">
                  <span>⏱</span> DURATION
                </div>
                <div class="metric-sub">Charged per hour</div>
              </div>

              <div class="time-input-group">
                <div class="modern-input">
                  <label for="hours-input">Hours</label>
                  <div class="step-group">
                    <button type="button"
                            class="step-btn"
                            data-target="hours-input"
                            data-step="-1">−</button>
                    <input  type="number"
                            id="hours-input"
                            name="hours"
                            min="0"
                            max="24"
                            value="0"
                            class="form-control step-input"
                            required>
                    <button type="button"
                            class="step-btn"
                            data-target="hours-input"
                            data-step="1">+</button>
                  </div>
                </div>

                <div class="modern-input">
                  <label for="minutes-input">Minutes</label>
                  <div class="step-group">
                    <button type="button"
                            class="step-btn"
                            data-target="minutes-input"
                            data-step="-5">−</button>
                    <input  type="number"
                            id="minutes-input"
                            name="minutes"
                            min="0"
                            max="59"
                            value="0"
                            class="form-control step-input"
                            required>
                    <button type="button"
                            class="step-btn"
                            data-target="minutes-input"
                            data-step="5">+</button>
                  </div>
                </div>
              </div>

              <div id="duration-total" class="duration-total">
                Total: <span>0h 0m</span>
              </div>
            </div>`;
        } else if (rateType === "per job") {
          html = `
            <div class="metric-section">
              <div class="metric-chip"><span>📦</span> Jobs</div>
              <input type="number" name="quantity" min="1" class="form-control mt-2"
                     placeholder="Number of jobs (e.g. 2)" required>
            </div>`;
        } else if (rateType === "per kilogram") {
          html = `
            <div class="metric-section">
              <div class="metric-chip"><span>⚖️</span> Kilogram</div>
              <input type="number" name="quantity" step="0.1" min="1" class="form-control mt-2"
                     placeholder="Total weight in kg (e.g. 3.5)" required>
            </div>`;
        } else {
          html = `
            <div class="metric-section">
              <div class="metric-chip"><span>📊</span> Quantity</div>
              <input type="number" name="quantity" min="1" class="form-control mt-2"
                     placeholder="Enter quantity" required>
            </div>`;
        }

        dynamicInput.innerHTML = html;

        // ✅ extra interactivity only for per-hour UI
        if (rateType === "per hour") {
          const hoursInput   = document.getElementById("hours-input");
          const minutesInput = document.getElementById("minutes-input");
          const totalLabel   = document.getElementById("duration-total")?.querySelector("span");

          function clampAndFix() {
            let h = parseInt(hoursInput.value || "0", 10);
            let m = parseInt(minutesInput.value || "0", 10);

            if (isNaN(h) || h < 0) h = 0;
            if (h > 24) h = 24;

            if (isNaN(m) || m < 0) m = 0;
            if (m > 59) m = 59;

            // normalize: 60m => +1h
            h += Math.floor(m / 60);
            if (h > 24) h = 24;
            m = m % 60;

            hoursInput.value = h;
            minutesInput.value = m;

            if (totalLabel) {
              totalLabel.textContent = `${h}h ${m}m`;
            }
          }

          // +/- buttons
          document.querySelectorAll(".step-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              const targetId = btn.getAttribute("data-target");
              const step     = Number(btn.getAttribute("data-step") || "0");
              const input    = document.getElementById(targetId);
              if (!input) return;

              const current = parseInt(input.value || "0", 10) || 0;
              input.value = current + step;
              clampAndFix();
            });
          });

          // Manual typing
          [hoursInput, minutesInput].forEach(el => {
            el.addEventListener("input", clampAndFix);
            el.addEventListener("blur", clampAndFix);
          });

          // initialize
          clampAndFix();
        }
      }


  // ----- Submit (AJAX) -----
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const formData = new FormData(form);
    try {
      const response = await fetch(window.location.href, {
        method: "POST",
        body: formData
      });
      const result = await response.json();

      if (result.error === "offline") {
        showPopup(result.message || "⚠️ Worker is currently offline.");
        return;
      }
      if (result.error === "giver_busy") {
        showPopup(result.message || "⚠️ You already have an active booking.");
        return;
      }
      if (result.redirect) {
        location.replace(result.redirect);
        return;
      }

      // Fallback
      showPopup("Unexpected response. Please try again.", "warning");
    } catch (err) {
      showPopup("❌ Error submitting booking. Please try again.");
    }
  });
});


// === Negotiation polling (unchanged, just copied) ===
(function(){
  let negId = null;
  let pollTimer = null;
  const overlay  = document.getElementById('neg-overlay');
  const titleEl  = document.getElementById('neg-title');
  const subEl    = document.getElementById('neg-subtitle');
  const priceEl  = document.getElementById('neg-worker-price');
  const msgEl    = document.getElementById('neg-msg');
  const btnOK    = document.getElementById('neg-confirm');
  const btnCancel= document.getElementById('neg-cancel');

  function showNegPopup(data){
    negId = data.id;
    titleEl.textContent = 'Custom price confirmation';
    subEl.textContent = `From: ${data.giver_name || 'Job Giver'} • Job: ${data.job_title || 'Custom job'}`;
    priceEl.value = '';
    msgEl.textContent = 'Enter your price. Booking unlocks when prices match.';
    overlay.style.display = 'flex';
    priceEl.focus();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(checkStatus, 2000);
  }

  function hideNegPopup(){
    overlay.style.display = 'none';
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    negId = null;
  }

  async function checkInbox(){
    if (negId) return;
    try{
      const r = await fetch('/negotiation/pending', {credentials:'same-origin'});
      const j = await r.json();
      if (j && j.ok && j.negotiation) showNegPopup(j.negotiation);
    }catch(e){}
  }

  async function checkStatus() {
    if (!negId) return;
    try {
      const r = await fetch('/negotiation/status?negotiation_id=' + negId, { credentials: 'same-origin' });
      const d = await r.json();
      if (!d || !d.ok) return;

      const giver = d.giver_price ? Number(d.giver_price).toFixed(2) : null;
      const worker = d.worker_price ? Number(d.worker_price).toFixed(2) : null;

      if (d.status === 'confirmed') {
        msgEl.textContent = `✅ Price matched at ₹${giver || worker}. You can book now.`;
        setTimeout(hideNegPopup, 1000);
      } else if (d.status === 'cancelled') {
        msgEl.textContent = '❌ Negotiation cancelled.';
        setTimeout(hideNegPopup, 800);
      } else {
        if (worker && !giver) {
          msgEl.textContent = `Your offer: ₹${worker}. Waiting for job giver to respond…`;
        } else if (giver && !worker) {
          msgEl.textContent = `Job giver offered ₹${giver}. Enter your price to match.`;
        } else if (giver && worker && giver !== worker) {
          msgEl.textContent = `You: ₹${worker} • Job giver: ₹${giver} — amounts must match.`;
        } else {
          msgEl.textContent = 'Enter your price. Booking unlocks when prices match.';
        }
      }
    } catch (e) {
      console.error('Negotiation polling error', e);
    }
  }

  btnOK?.addEventListener('click', async () => {
    if (!negId) return;
    const val = priceEl.value;
    if (!val) {
      priceEl.focus();
      return;
    }
    try {
      const r = await fetch('/negotiation/offer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          negotiation_id: negId,
          role: 'worker',
          price: val
        })
      });
      const d = await r.json();

      const worker = Number(val).toFixed(2);
      const giver = d.giver_price ? Number(d.giver_price).toFixed(2) : null;

      if (d.status === 'confirmed') {
        msgEl.textContent = `✅ Price matched at ₹${giver || worker}. You can book now.`;
        setTimeout(hideNegPopup, 1000);
      } else if (giver) {
        msgEl.textContent = `Your offer: ₹${worker}. Job giver offered ₹${giver}. Amounts must match.`;
      } else {
        msgEl.textContent = `Your offer: ₹${worker}. Waiting for job giver to enter price…`;
      }
    } catch (e) {
      console.error('Negotiation offer error', e);
      msgEl.textContent = 'Network error. Try again.';
    }
  });

  btnCancel?.addEventListener('click', async ()=>{
    if (!negId) return hideNegPopup();
    try{
      await fetch('/negotiation/cancel', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ negotiation_id: negId })
      });
    }catch(e){}
    hideNegPopup();
  });

  setInterval(checkInbox, 3000);
  checkInbox();
})();
</script>

</body>
</html>
