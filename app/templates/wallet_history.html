<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wallet History</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:24px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:8px; border-bottom:1px solid #eef2f7; font-size:14px; }
  </style>
</head>
<body>
  <h2>📂 Wallet History</h2>
  <table>
    <thead><tr><th>When</th><th>Kind</th><th>Amount</th><th>Ref</th><th>Meta</th></tr></thead>
    <tbody>
    {% for t in txns %}
      <tr>
        <td>{{ t.created_at.strftime("%Y-%m-%d %H:%M") }}</td>
        <td>{{ t.kind }}</td>
        <td>{{ "₹" + format(t.amount, "0.2f") }}</td>
        <td>{{ t.reference or "" }}</td>
        <td>{{ t.meta_json or "" }}</td>
      </tr>
    {% else %}
      <tr><td colspan="5">No transactions yet</td></tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
